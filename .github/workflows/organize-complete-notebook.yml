name: Organize the complete original notebook

on:
  push:
    branches:
      - fix/preserve-all-notebook-cells
    paths:
      - scripts/organize_full_notebook.py
      - .github/workflows/organize-complete-notebook.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notebook validator
        run: python -m pip install nbformat
      - name: Insert headings without altering original cells
        run: python scripts/organize_full_notebook.py
      - name: Commit organized complete notebook to feature branch
        run: |
          if git diff --quiet -- Segmentation.ipynb; then
            echo "Notebook was already organized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Segmentation.ipynb
          git commit -m "docs(notebook): organize original 106 cells without deleting any experiments"
          git push origin HEAD:fix/preserve-all-notebook-cells
